[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 1000
evm_version = "cancun"
via_ir = false
# Tests sign with a real P256 key via script/webauthn.js instead of mocking.
ffi = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

# Monad testnet (10143) / mainnet (143).
# See https://docs.monad.xyz/developer-essentials/testnets
